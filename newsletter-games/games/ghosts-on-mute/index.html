<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghosts on Mute | KPMG Minigames</title>
    <style>
        /* Bebas Neue, SIL OFL 1.1, Dharma Type: the site's own vendored subset
           (licence beside it), shared with MULTIPLEX and Field Goal. Self-hosted, never a font CDN.
           The weight range maps canvas 'bold' onto the one real weight. */
        @font-face {
            font-family: 'Bebas Neue';
            src: url('../../assets/fonts/BebasNeue-subset.woff2') format('woff2');
            font-weight: 400 700;
            font-style: normal;
            font-display: swap;
        }
        /* The newsletter's own palette (D2, declared in game.js and the decision file), not KPMG's.
           Text pairs, WCAG 2.x, measured 2026-10-14 in python:
             #ECECEC on #151726 15.03 (header)   #151726 on #EEECFA 15.23 (overlay body)
             #462B41 on #EEECFA 10.71 (titles)   #151726 on #F2882D 7.05 (primary button)
             #462B41 on #EDDCF3 9.59 (legend)    #151726 on #EDDCF3 13.64 (legend)
           Never #ECECEC on #F2882D (2.13). */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #151726;
            font-family: Arial, Helvetica, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100dvh; overflow: hidden;
        }
        .game-header {
            width: 100%; background: #151726; color: #ECECEC;
            padding: 2px 4px; display: flex; align-items: center; gap: 12px;
            font-size: 14px;
        }
        .game-header a { color: #ECECEC; text-decoration: none; font-size: 20px; min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
        .game-header h1 {
            font-family: 'Bebas Neue', 'Arial Black', Arial, sans-serif;
            font-size: 22px; font-weight: 400; letter-spacing: 1px; color: #ECECEC;
        }
        .game-header .mute-btn {
            margin-left: auto; background: #151726; border: 1px solid #AFB7D1;
            color: #ECECEC; font-size: 16px; line-height: 1; cursor: pointer;
            width: 44px; height: 44px; border-radius: 4px; padding: 0;
        }
        .game-header .mute-btn:hover { border-color: #F2882D; }
        .game-header a:focus-visible, .game-header .mute-btn:focus-visible { outline: 2px solid #F2882D; outline-offset: 2px; }
        #game-container {
            position: relative; width: 100%; max-width: 1600px;
            flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center;
        }
        #game-canvas { display: block; touch-action: none; }
        /* Overlays as the newsletter's lavender cards. The engine writes inline styles, hence !important. */
        .game-over-overlay {
            display: none; position: absolute; inset: 0;
            background: #EEECFA !important; color: #151726 !important;
            flex-direction: column; align-items: center; justify-content: safe center;
            gap: 0; z-index: 10; padding: 24px; text-align: center;
            overflow-y: auto;
        }
        .game-over-overlay.active { display: flex; }
        .game-over-overlay [style*="10px"], .game-over-overlay [style*="11px"] { font-size: 12px !important; }
        .game-over-overlay div { opacity: 1 !important; color: #151726 !important; }   /* faded labels drop contrast */
        .game-over-overlay > div:first-of-type {
            font-family: 'Bebas Neue', 'Arial Black', Arial, sans-serif !important;
            font-size: 40px !important; font-weight: 400 !important; letter-spacing: 2px !important;
            color: #462B41 !important;
        }
        .game-over-overlay > div:first-of-type::after {
            content: ''; display: block; width: 72px; height: 5px; margin: 6px auto 0;
            background: #F2882D; border-radius: 3px;
        }
        .game-over-overlay > div > div { background: #EDDCF3 !important; }   /* legend tiles */
        .game-over-overlay .gom-rank {
            font-family: 'Bebas Neue', 'Arial Black', Arial, sans-serif !important;
            font-size: 28px !important; letter-spacing: 1px; color: #462B41 !important;
        }
        .game-over-overlay .gom-rank-line { font-size: 15px !important; max-width: 340px; line-height: 1.4; margin-bottom: 16px; }
        .game-over-overlay button {
            background: #F2882D !important; color: #151726 !important; border: 2px solid #F2882D !important;
        }
        .game-over-overlay button + button { background: transparent !important; color: #462B41 !important; border-color: #462B41 !important; }
        .game-over-overlay button:focus-visible { outline: 3px solid #462B41; outline-offset: 3px; }
        @media (prefers-reduced-motion: reduce) {
            /* still dynamic: the engine's START button scale becomes a brightness change */
            .game-over-overlay button { transition: filter 0.15s ease !important; transform: none !important; }
            .game-over-overlay button:hover { filter: brightness(1.08); }
        }
    </style>
</head>
<body>
    <div class="game-header">
        <a href="../../" title="Back to hub" aria-label="Back to hub">&larr;</a>
        <h1>Ghosts on Mute</h1>
        <button class="mute-btn" id="mute-toggle" type="button" aria-label="Toggle sound" title="Sound on / off">&#128263;</button>
    </div>
    <div id="game-container">
        <canvas id="game-canvas" aria-label="Ghosts on Mute game board"></canvas>
    </div>
    <script src="../../assets/game-engine.js"></script>
    <!-- ponytail: borrows the shootout's synthesised kit (tick, ohh, whistle) rather than copying it, as field-goal does; fork it if this game ever needs its own sounds -->
    <script src="../penalty-pressure/audio.js"></script>
    <script src="model.js"></script>
    <script src="art.js"></script>
    <script src="game.js"></script>
    <script>
        /* Mute toggle, opt-in audio. The first click also unlocks the AudioContext. */
        (function () {
            var btn = document.getElementById('mute-toggle');
            if (!btn) return;
            function sync() {
                var on = window.PPAudio && !window.PPAudio.isMuted();
                btn.innerHTML = on ? '&#128266;' : '&#128263;';
                btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            }
            btn.addEventListener('click', function () {
                if (window.PPAudio) { window.PPAudio.unlock(); window.PPAudio.toggle(); }
                sync();
            });
            sync();
        })();
    </script>
</body>
</html>
