<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FLASH! Red Carpet Rush | KPMG Minigames</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #2B0A1E;
            font-family: Arial, Helvetica, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100dvh; overflow: hidden;
        }
        /* Header stays KPMG Blue so the game reads as part of the hub -
           the bespoke magazine pinks are scoped to the canvas. See the
           brand-deviation note in game.js. */
        .game-header {
            width: 100%; background: #00338D; color: white;
            padding: 8px 16px; display: flex; align-items: center; gap: 12px;
            font-size: 14px;
        }
        .game-header a { color: white; text-decoration: none; font-size: 20px; }
        .game-header h1 { font-size: 16px; font-weight: bold; }
        .game-header .mute-btn {
            margin-left: auto; background: rgba(255,255,255,0.12); border: none;
            color: white; font-size: 16px; line-height: 1; cursor: pointer;
            width: 32px; height: 32px; border-radius: 4px; padding: 0;
        }
        .game-header .mute-btn:hover { background: rgba(255,255,255,0.24); }
        #game-container {
            position: relative; width: 100%; max-width: 1600px;
            flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center;
        }
        #game-canvas {
            display: block;
            touch-action: none;
        }
        .game-over-overlay {
            display: none; position: absolute; inset: 0;
            background: rgba(43, 10, 30, 0.94); color: white;
            flex-direction: column; align-items: center; justify-content: safe center;
            gap: 16px; z-index: 10; padding: 24px; text-align: center;
            overflow-y: auto;
        }
        .game-over-overlay.active { display: flex; }
        .game-over-overlay .score-display { font-size: 48px; font-weight: bold; color: #FF6FB5; }
        .game-over-overlay .label { font-size: 14px; opacity: 0.8; }
        .game-over-overlay .stat { font-size: 20px; font-weight: bold; }
        .game-over-overlay button {
            padding: 12px 32px; border: none; border-radius: 4px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
        }
        .btn-play-again { background: #FF2D8E; color: white; }
        .btn-hub { background: white; color: #C0116B; }
        .btn-play-again:hover { background: #FF6FB5; }
    </style>
</head>
<body>
    <div class="game-header">
        <a href="../../" title="Back to hub">&larr;</a>
        <h1>FLASH! Red Carpet Rush</h1>
        <button class="mute-btn" id="mute-toggle" type="button" aria-label="Toggle sound" title="Sound on / off">&#128263;</button>
    </div>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div class="game-over-overlay" id="game-over">
            <div class="label">SCORE</div>
            <div class="score-display" id="final-score">0</div>
            <div class="label">BEST SCORE</div>
            <div class="stat" id="best-score">0</div>
            <div class="label">LEADERBOARD RANK</div>
            <div class="stat" id="rank">-</div>
            <div class="label" id="attempts-left">2 attempts remaining</div>
            <button class="btn-play-again" id="btn-again">Play Again</button>
            <button class="btn-hub" onclick="window.location.href='../../'">Back to Hub</button>
        </div>
    </div>
    <script src="../../assets/game-engine.js"></script>
    <script src="audio.js"></script>
    <script src="game.js"></script>
    <script>
        /* Mute toggle - opt-in audio. First click also unlocks the AudioContext
           (browser autoplay policy requires a user gesture). */
        (function () {
            var btn = document.getElementById('mute-toggle');
            if (!btn) return;
            function sync() {
                var on = window.RCAudio && !window.RCAudio.isMuted();
                btn.innerHTML = on ? '&#128266;' : '&#128263;'; // 🔊 / 🔇
                btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            }
            btn.addEventListener('click', function () {
                if (window.RCAudio) {
                    window.RCAudio.unlock();
                    window.RCAudio.toggle();
                }
                sync();
            });
            sync();
        })();
    </script>
</body>
</html>
