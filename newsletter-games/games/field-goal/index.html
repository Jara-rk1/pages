<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Field Goal at the 'G | KPMG Minigames</title>
    <style>
        /* Bebas Neue, SIL OFL 1.1, Dharma Type: the site's own vendored subset
           (licence beside it), shared with MULTIPLEX. Self-hosted, never a font CDN.
           The weight range maps canvas 'bold' onto the one real weight. */
        @font-face {
            font-family: 'Bebas Neue';
            src: url('../../assets/fonts/BebasNeue-subset.woff2') format('woff2');
            font-weight: 400 700;
            font-style: normal;
            font-display: swap;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #C3E7F4;       /* the newsletter's sky */
            font-family: Arial, Helvetica, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100dvh; overflow: hidden;
        }
        .game-header {
            width: 100%; background: #00338D; color: white;
            padding: 8px 16px; display: flex; align-items: center; gap: 12px;
            font-size: 14px;
        }
        .game-header a { color: white; text-decoration: none; font-size: 20px; }
        .game-header h1 { font-size: 16px; font-weight: bold; }
        .game-header .mute-btn {
            margin-left: auto; background: rgba(255,255,255,0.12); border: none;
            color: white; font-size: 16px; line-height: 1; cursor: pointer;
            width: 32px; height: 32px; border-radius: 4px; padding: 0;
        }
        .game-header .mute-btn:hover { background: rgba(255,255,255,0.24); }
        #game-container {
            position: relative; width: 100%; max-width: 1600px;
            flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center;
        }
        #game-canvas { display: block; touch-action: none; }
        /* Overlays in the newsletter's page 5 colours: navy (#023C91, 7.80:1 on the sky) on
           the sky, a red rule under the title. The engine writes inline styles, hence !important. */
        .game-over-overlay {
            display: none; position: absolute; inset: 0;
            background: rgba(195, 231, 244, 0.97); color: #023C91;
            flex-direction: column; align-items: center; justify-content: safe center;
            gap: 16px; z-index: 10; padding: 24px; text-align: center;
            overflow-y: auto;
        }
        .game-over-overlay.active { display: flex; }
        .game-over-overlay > div { opacity: 1 !important; }            /* faded labels drop below 4.5:1 */
        .game-over-overlay > div:first-of-type {
            font-family: 'Bebas Neue', 'Arial Black', Arial, sans-serif !important;
            font-size: 40px !important; font-weight: 400 !important; letter-spacing: 2px !important;
        }
        .game-over-overlay > div:first-of-type::after {
            content: ''; display: block; width: 72px; height: 5px; margin: 6px auto 0;
            background: #F0001B; border-radius: 3px;
        }
        .game-over-overlay > div > div { background: rgba(255, 255, 255, 0.7) !important; }   /* legend tiles */
        .game-over-overlay button {
            background: #023C91 !important; color: #FFFFFF !important; border: 2px solid #023C91 !important;
        }
        .game-over-overlay button + button { background: transparent !important; color: #023C91 !important; }
        /* a figure, not a div: cobe wraps its canvas in a div, which would take the title rule */
        .fg-globe-wrap { width: 190px; height: 190px; margin: -6px auto -4px; flex-shrink: 0; }
        .fg-globe { display: block; width: 100%; height: 100%; }
        .game-over-overlay .score-display { font-size: 48px; font-weight: bold; }
        .game-over-overlay .label { font-size: 14px; opacity: 0.8; }
        .game-over-overlay .stat { font-size: 20px; font-weight: bold; }
        .game-over-overlay button {
            padding: 12px 32px; border: none; border-radius: 4px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
        }
        .btn-play-again { background: #00B8F5; color: white; }
        .btn-hub { background: white; color: #00338D; }
        .btn-play-again:hover { background: #1E49E2; }
    </style>
</head>
<body>
    <div class="game-header">
        <a href="../../" title="Back to hub">&larr;</a>
        <h1>Field Goal at the 'G</h1>
        <button class="mute-btn" id="mute-toggle" type="button" aria-label="Toggle sound" title="Sound on / off">&#128263;</button>
    </div>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div class="game-over-overlay" id="game-over">
            <div class="label">SCORE</div>
            <div class="score-display" id="final-score">0</div>
            <div class="label">BEST SCORE</div>
            <div class="stat" id="best-score">0</div>
            <div class="label">LEADERBOARD RANK</div>
            <div class="stat" id="rank">-</div>
            <div class="label" id="attempts-left">2 attempts remaining</div>
            <button class="btn-play-again" id="btn-again">Play Again</button>
            <button class="btn-hub" onclick="window.location.href='../../'">Back to Hub</button>
        </div>
    </div>
    <script type="module">
        /* The intro globe on the instructions card: San Francisco and Los Angeles to Melbourne,
           the two trips in the newsletter's story (49ers a week early, Rams 28 hours out).
           cobe 2.0.1, MIT, vendored beside its LICENSE; it makes no network calls (its map is
           an inline data URI) and has no loop of its own, so we drive it. No WebGL: no globe.
           Reduced motion: a still globe over the Pacific. */
        import createGlobe from '../../assets/vendor/cobe/cobe-2.0.1.esm.js';
        var SFO = [37.62, -122.38], LAX = [33.94, -118.41], MEL = [-37.82, 144.98];
        var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var container = document.getElementById('game-container');
        var globe = null, raf = 0;
        function phiFor(lng) { return Math.PI - (lng * Math.PI / 180 - Math.PI / 2); }   // cobe's centring rule
        function stop() { cancelAnimationFrame(raf); raf = 0; if (globe) { globe.destroy(); globe = null; } }
        function mount(overlay) {
            var cv = document.createElement('canvas');
            cv.className = 'fg-globe'; cv.width = 380; cv.height = 380;
            var fig = document.createElement('figure');
            fig.className = 'fg-globe-wrap'; fig.setAttribute('aria-hidden', 'true');
            fig.appendChild(cv);
            overlay.insertBefore(fig, overlay.firstChild);
            try {
                globe = createGlobe(cv, {
                    devicePixelRatio: 2, width: 380, height: 380,
                    phi: phiFor(still ? -170 : SFO[1]), theta: still ? 0 : 0.4, dark: 0, diffuse: 1.2,
                    mapSamples: 12000, mapBrightness: 5, baseColor: [1, 1, 1],
                    markerColor: [0.94, 0, 0.11], glowColor: [0.76, 0.91, 0.96],
                    markers: [{ location: SFO, size: 0.05 }, { location: LAX, size: 0.05 }, { location: MEL, size: 0.07 }],
                    arcs: [{ from: SFO, to: MEL, color: [0.67, 0, 0] }, { from: LAX, to: MEL, color: [0, 0.21, 0.58] }],
                    arcColor: [0.01, 0.24, 0.57], arcWidth: 0.7, arcHeight: 0.3
                });
            } catch (e) { fig.remove(); globe = null; return; }
            globe.update({});
            if (still) return;
            var t0 = performance.now();
            (function tick(now) {                   // hold on California, cross the Pacific, settle on Melbourne
                var t = Math.min(1, Math.max(0, ((now - t0) / 1000 - 0.6) / 2.8)), e = 1 - Math.pow(1 - t, 3);
                if (globe) globe.update({ phi: phiFor(SFO[1] - 92.6 * e), theta: 0.4 - 1.0 * e });
                if (t < 1 && globe) raf = requestAnimationFrame(tick);
            })(t0);
        }
        function check() {
            var ov = container.querySelector('.game-over-overlay');
            var start = ov && ov.style.display !== 'none' &&
                Array.prototype.some.call(ov.querySelectorAll('button'), function (b) { return /^start$/i.test(b.textContent.trim()); });
            if (start && !ov.querySelector('.fg-globe')) mount(ov);
            else if (!start && globe) stop();
        }
        new MutationObserver(check).observe(container, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
        check();
    </script>
    <script src="../../assets/game-engine.js"></script>
    <!-- ponytail: borrows the shootout's synthesised kit (kick, roar, ohh, tick) rather than copying it; fork it if this game ever needs its own sounds -->
    <script src="../penalty-pressure/audio.js"></script>
    <script src="game.js"></script>
    <script>
        /* Mute toggle, opt-in audio. The first click also unlocks the AudioContext. */
        (function () {
            var btn = document.getElementById('mute-toggle');
            if (!btn) return;
            function sync() {
                var on = window.PPAudio && !window.PPAudio.isMuted();
                btn.innerHTML = on ? '&#128266;' : '&#128263;';
                btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            }
            btn.addEventListener('click', function () {
                if (window.PPAudio) { window.PPAudio.unlock(); window.PPAudio.toggle(); }
                sync();
            });
            sync();
        })();
    </script>
</body>
</html>
