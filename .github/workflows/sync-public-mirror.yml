# Keeps the KPMG-internal Pages mirror (kpmg-au-emu/pepi-portfolio) in sync with
# the public origin (Jara-rk1/pages), which receives automated dashboard deploys daily.
# Runs ONLY on the KPMG repo (repo-gated below); on the public repo this file is inert.
# Fast-forward only: a kpmg-only commit makes this fail loudly rather than fork history.
# NEVER push directly to the mirror's main: all content must arrive via this sync,
# or the next ff-only merge fails. This includes commits touching .github/workflows/**:
# those used to need a manual hand-push because GITHUB_TOKEN is blocked from updating
# workflow files ("refusing to allow a GitHub App to update workflow without workflows
# permission", run 27328805250). As of 2026-06-17 the push below authenticates with the
# MIRROR_SYNC_PAT secret (a PAT scoped to THIS repo with Workflows:write + Contents:write),
# which CAN carry workflow-file changes, so the sync is now fully automatic. If that
# secret is ever missing/expired, workflow-file commits fail here and must be hand-pushed
# with matching SHAs (git -C pages push kpmg main) until it's restored.
# Setup / rotation: docs/runbooks/gh-pages-manual-actions.md, Job 5.
name: Sync mirror from public origin
on:
  schedule:
    # Daily 23:43 UTC. Minute 43 (not :00) dodges GitHub's top-of-the-hour
    # schedule-event drops, and 23:43 runs AFTER the public surface's nightly
    # news deploy (23:13 cron) so the mirror picks up same-day content
    # instead of trailing by 24h.
    - cron: '43 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  issues: write
  # Load-bearing for the alert step: it reads its own run's jobs to name the
  # step that failed. `permissions:` is declared, so anything unlisted is
  # `none` and listJobsForWorkflowRun would 403.
  actions: read
jobs:
  sync:
    if: github.repository == 'kpmg-au-emu/pepi-portfolio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Authenticate with a PAT (Workflows:write + Contents:write, scoped to this
          # repo) instead of the default GITHUB_TOKEN, so the ff-only push below can
          # carry .github/workflows/** changes. checkout persists this credential for
          # the push step and scrubs it in its post-job cleanup. See runbook Job 5.
          token: ${{ secrets.MIRROR_SYNC_PAT }}
      - name: Fast-forward main from public origin
        run: |
          git remote add public https://github.com/Jara-rk1/pages.git
          git fetch public main
          git merge --ff-only public/main
          git push origin main
      - name: Request Pages build
        # The legacy pages-build-deployment may not auto-trigger on pushes
        # made with GITHUB_TOKEN; request a build explicitly so the served
        # internal site can never silently fall behind the repo.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" \
            || echo "Pages build request failed (a build may already be queued)"
      - name: Alert on failure (sync broke)
        # Names the step that actually failed, because the two real causes are
        # different problems with different fixes: an expired MIRROR_SYNC_PAT
        # fails at CHECKOUT, a genuine divergence fails at the FAST-FORWARD.
        # Asserting divergence unconditionally has already filed issues carrying
        # the wrong diagnosis, more than once.
        # `actions: read` below is load-bearing: `permissions:` is declared, so
        # anything unlisted is `none` and listJobsForWorkflowRun would 403.
        if: failure() || cancelled()
        uses: actions/github-script@v8
        with:
          script: |
            // Never let the diagnosis break the alert: a thrown lookup must
            // still file an issue, or a failure becomes silent.
            let step = 'unknown (lookup failed)'
            try {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId,
              })
              const failed = jobs.data.jobs
                .flatMap(j => j.steps || [])
                .find(s => s.conclusion === 'failure')
              step = failed ? failed.name : 'none (job cancelled, or it never started)'
            } catch (e) {
              step = `unknown (${e.message})`
            }
            const cause = /checkout/i.test(step)
              ? [`Checkout failed, so this is AUTHENTICATION, not divergence.`,
                 `MIRROR_SYNC_PAT is most likely expired or revoked: org policy caps`,
                 `fine-grained PAT lifetime at about 90 days, so it lapses on a schedule.`,
                 `Rotate it per docs/runbooks/gh-pages-manual-actions.md, Job 5 (skip its`,
                 `step 3, the one-time bootstrap hand-push, which is already done).`].join('\n')
              : /fast-forward/i.test(step)
              ? [`The fast-forward failed, so the mirror holds a commit the public origin`,
                 `lacks. Someone pushed directly to the mirror. Find that commit and move`,
                 `it to the public origin instead; never push to the mirror, because every`,
                 `later --ff-only sync fails until it is gone.`].join('\n')
              : `Not one of the two known causes. Read the run log.`
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Mirror sync failed at "${step}" (run ${context.runId})`,
              body: [
                `The mirror sync failed. The internal Pages surface stops updating until`,
                `this is resolved.`,
                ``,
                `**Failed step:** \`${step}\``,
                ``,
                cause,
                ``,
                `Run log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['automation'],
            })
